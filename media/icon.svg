<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="ceasg — visual Mermaid editor">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2AC9D6"/>
      <stop offset="1" stop-color="#4263EB"/>
    </linearGradient>
  </defs>

  <!-- background tile -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#sea)"/>

  <!-- trident-as-diagram, scaled up around the centre -->
  <g transform="translate(-10 10) translate(128 128) rotate(45) scale(1.34) translate(-128 -128)">
    <!-- connectors -->
    <g fill="none" stroke="#FFFFFF" stroke-width="11"
       stroke-linecap="round" stroke-linejoin="round">
      <!-- crossbar -->
      <path d="M88 122 L168 122"/>
      <!-- shaft down to the base node -->
      <path d="M128 122 L128 190"/>
      <!-- three prongs -->
      <path d="M88 122 L88 78"/>
      <path d="M128 122 L128 52"/>
      <path d="M168 122 L168 78"/>
    </g>

    <!-- spear-tip arrowheads (pointing up, like diagram arrows) -->
    <g fill="#FFFFFF">
      <path d="M88 50 L76 78 L100 78 Z"/>
      <path d="M128 26 L116 54 L140 54 Z"/>
      <path d="M168 50 L156 78 L180 78 Z"/>
    </g>

    <!-- base node -->
    <circle cx="128" cy="200" r="16" fill="#FFFFFF"/>
  </g>
</svg>
